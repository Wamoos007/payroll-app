name: Build and Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v2.4.6"
        required: true
        default: "v2.4.6"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci --omit=optional

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build Windows installer
        id: build_win
        shell: pwsh
        run: |
          npm run build:win 2>&1 | Tee-Object -FilePath build-win.log
          exit $LASTEXITCODE

      - name: Show build log on failure
        if: failure()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Build Windows installer - failure log (last 200 lines)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          if (Test-Path build-win.log) {
            Get-Content build-win.log -Tail 200 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "(no log file was produced)"
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
